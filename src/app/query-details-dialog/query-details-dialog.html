<h2 class="mat-dialog-title">Query Details</h2>

<mat-dialog-content>

    <div class="form-group">

        <label>Name</label>

        <input
            type="text"
            [value]="query.name"
            readonly>

    </div>

    <div class="form-group">

        <label>Email</label>

        <input
            type="email"
            [value]="query.email"
            readonly>

    </div>

    <div class="form-group">

        <label>Subject</label>

        <input
            type="text"
            [value]="query.subject"
            readonly>

    </div>

    <div class="form-group">

        <label>Priority</label>

        <input
            type="text"
            [value]="query.priority"
            readonly>

    </div>

    <div class="form-group">

        <label>Description</label>

        <textarea
            rows="5"
            readonly>{{query.description}}</textarea>

    </div>

</mat-dialog-content>

<mat-dialog-actions align="end">

    <button mat-stroked-button>
        Edit
    </button>

    <button mat-flat-button>
        Close
    </button>

</mat-dialog-actions>
